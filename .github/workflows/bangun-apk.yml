name: Bangun Mumla

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode & submodul
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Bersihkan sisa bangunan lama & cache
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper
          ./gradlew clean --no-daemon || true

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang NDK versi yang dibutuhkan
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393"

      - name: Tulis lokasi SDK & NDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> local.properties

      - name: Beri izin jalankan Gradle
        run: chmod +x gradlew libraries/humla/gradlew

      - name: 🔴 BANGUN SPONGYCASTLE DULU — WAJIB!
        run: |
          cd libraries/humla/libs/humla-spongycastle
          ../../../../gradlew jar
          cd ../../../../

      - name: ✅ Bangun APK utama — BERSIH & BARU
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Simpan hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: Mumla-APK
          path: app/build/outputs/apk/debug/*.apk
