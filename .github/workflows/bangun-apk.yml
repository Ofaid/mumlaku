name: Bangun Mumla

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode & submodul
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Penting untuk proyek dengan banyak submodul

      - name: Siapkan Java 17
        # Catatan: Kebanyakan proyek Android stabil di Java 17. 
        # Jika proyek Mumla Anda spesifik minta Java 21, silakan ganti kembali.
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Siapkan Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Instal NDK Spesifik
        # Menggunakan sdkmanager langsung sering lebih stabil di GitHub Runner
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393"

      - name: Tulis local.properties
        # Menentukan ndk.dir secara paksa agar Gradle tidak bingung
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> local.properties

      - name: Beri izin Gradle
        run: chmod +x gradlew

      - name: Bangun APK
        # Menggunakan --no-daemon untuk menghemat RAM di GitHub Actions
        # Tambahkan -Pandroid.useDeprecatedNdk=true jika proyeknya sangat lama
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Mumla-APK
          # Pastikan path ini sesuai. Mumla biasanya ada di folder 'app' 
          # atau folder utama proyek.
          path: "** /build/outputs/apk/debug/*.apk" 
